name: update-chip
on:
  schedule:
    - cron: "30 9 * * 1-5"    # 台灣時間 17:30
    - cron: "30 13 * * 1-5"   # 台灣時間 21:30（補抓）
  workflow_dispatch:
concurrency:
  group: repo-write
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python chip.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add chip.json
          git commit -m "chip" || echo "no change"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break; sleep $((RANDOM % 10 + 5)); done
