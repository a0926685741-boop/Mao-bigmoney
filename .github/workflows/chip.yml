name: update-market
on:
  schedule:
    - cron: "*/15 * * * 1-5"
  workflow_dispatch:
concurrency:
  group: repo-write
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  m:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python market.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add market.json
          git commit -m "market" || echo "no change"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break; sleep $((RANDOM % 10 + 5)); done
