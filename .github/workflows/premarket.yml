name: premarket
on:
  workflow_dispatch:
  schedule:
    - cron: '50 23 * * 0-4'
    - cron: '20 0 * * 1-5'
concurrency:
  group: repo-write
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: build
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          echo '' | base64 -d | python3 -c "import sys,zlib;sys.stdout.buffer.write(zlib.decompress(sys.stdin.buffer.read()))" > premarket.py
          python3 premarket.py
      - name: commit
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add premarket.html premarket.json premarket_log.txt watch.txt || true
          git diff --cached --quiet && exit 0
          git commit -m "premarket"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break; sleep 5; done
