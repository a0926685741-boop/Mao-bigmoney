name: probe-warrant
on:
  workflow_dispatch:
concurrency:
  group: repo-write
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          cat > probe.py <<'EOF'
          import json, urllib.request, datetime
          UA = {"User-Agent": "Mozilla/5.0", "Accept": "application/json,text/plain,*/*"}
          out = []
          def log(*a):
              s = " ".join(str(x) for x in a)
              print(s)
              out.append(s)
          def head(url, n=1500):
              req = urllib.request.Request(url, headers=UA)
              r = urllib.request.urlopen(req, timeout=90)
              return r.headers.get("Content-Length"), r.read(n).decode("utf-8", "replace")
          def full(url):
              req = urllib.request.Request(url, headers=UA)
              return urllib.request.urlopen(req, timeout=90).read()
          for name, url in [("TWSE", "https://openapi.twse.com.tw/v1/swagger.json"), ("TPEX", "https://www.tpex.org.tw/openapi/swagger.json")]:
              log("==== swagger", name)
              try:
                  j = json.loads(full(url))
                  base = url.rsplit("/", 1)[0]
                  hits = []
                  for p, v in j.get("paths", {}).items():
                      txt = json.dumps(v, ensure_ascii=False)
                      if "權證" in txt or "warrant" in p.lower() or "認購" in txt or "認售" in txt:
                          hits.append(p)
                          log("PATH", p, "|", (v.get("get") or {}).get("summary"))
                  log("matched", len(hits), "of", len(j.get("paths", {})))
                  for p in hits[:12]:
                      try:
                          cl, t = head(base + p)
                          log("SAMPLE", p, "content-length=", cl)
                          log(t[:900])
                      except Exception as e:
                          log("SAMPLE FAIL", p, e)
              except Exception as e:
                  log("swagger FAIL", name, e)
          log("==== TWSE MI_INDEX type=0999 (warrants) by date")
          today = datetime.date.today()
          for back in (1, 2, 3, 4, 5, 15, 16, 17, 30, 31, 32, 60, 61, 62):
              d = (today - datetime.timedelta(days=back)).strftime("%Y%m%d")
              url = "https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date=" + d + "&type=0999&response=json"
              try:
                  j = json.loads(full(url))
                  tabs = j.get("tables") or []
                  log("DATE", d, "stat=", j.get("stat"), "tables=", len(tabs))
                  for t in tabs:
                      log("  TABLE", t.get("title"), "rows=", len(t.get("data") or []))
                      if t.get("data") and ("權證" in (t.get("title") or "")):
                          log("   FIELDS", t.get("fields"))
                          log("   ROW0", t["data"][0])
                          log("   ROW1", t["data"][1] if len(t["data"]) > 1 else "")
              except Exception as e:
                  log("DATE", d, "FAIL", e)
          open("probe.txt", "w", encoding="utf-8").write("\n".join(out))
          EOF
          python probe.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add probe.txt
          git commit -m "probe" || echo "no change"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break; sleep $((RANDOM % 10 + 5)); done
