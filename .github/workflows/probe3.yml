name: probe-news-futures
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: probe
        continue-on-error: true
        run: |
          echo '' | base64 -d | python3 -c "import sys,zlib;sys.stdout.buffer.write(zlib.decompress(sys.stdin.buffer.read()))" > probe3.py
          python3 probe3.py
      - name: commit
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add probe3.txt
          git diff --cached --quiet && exit 0
          git commit -m "probe3"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break; sleep 5; done
