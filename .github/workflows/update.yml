name: update-data
on:
  schedule:
    - cron: "30 10 * * 1-5"   # 台灣時間 18:30
    - cron: "0 15 * * 1-5"    # 台灣時間 23:00（補抓較晚公布的資料）
  workflow_dispatch:
concurrency:
  group: repo-write
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build_data.py
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git commit -m "update data" || echo "no change"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break; sleep $((RANDOM % 10 + 5)); done
