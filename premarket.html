const lv=(L,t)=>L&&L.length?`<tr><td>${t}</td><td>${L.map(z=>`${esc(z.label)} ${fmt(z.price,2)}（${sg(z.gap_pct)}%）`).join('；')}</td></tr>`:'';

return `<div class="c" style="margin:8px 0"><h2>${esc(i.code)} ${esc(i.name)} ${tag(i.ver)}</h2>${(i.warn||[]).map(x=>`<div class="w2">⚠ ${esc(x)}</div>`).join('')}<table><tr><td>收盤（${esc(i.date)}）</td><td>${fmt(i.close,2)} <span class="${cl(i.pct)}">${sg(i.pct)}%</span></td></tr><tr><td>成交量／量比</td><td>${fmt(i.vol)} 張／${i.vol_ratio==null?'—':i.vol_ratio}</td></tr>${lv(i.up,'上方壓力（簡易）')}${lv(i.dn,'下方支撐（簡易）')}${mg}</table><div class="m">${esc(i.chk||'')}｜資料：${esc(i.src)}</div></div>`}).join('')+'<div class="m">壓力支撐為簡易版：均線與近 20／60／250 日高低中離現價最近的位置，和個股頁 K 線圖的壓撐區算法不同，只是參考。</div>';h+=card('釘選股',b)})();
// 新聞
(function(){const n=R.news;let b=err(n);if(n.ok){const L=a=>a&&a.length?'<ul class="nw">'+a.map(x=>`<li><a href="${esc(link(x.u))}" target="_blank" rel="noopener">${esc(x.zh||x.t)}</a>${x.zh?`<div class="s">${esc(x.t)}</div>`:''}<div class="s">${esc(x.s)}｜${esc(x.time)}${x.zh?'｜機器翻譯':''}</div></li>`).join('')+'</ul>':'<div class="m">沒有抓到。</div>';
b+='<h2>台股</h2>'+L(n.tw)+'<h2>美股</h2>'+L(n.us)+'<h2>CNBC（英文，附機器翻譯）</h2>'+L(n.cnbc);
const w=R.watch.ok?R.watch.items:[];Object.keys(n.stock||{}).forEach(c=>{const nm=(w.find(i=>i.code===c)||{}).name||'';b+=`<h2>${esc(c)} ${esc(nm)}</h2>`+L(n.stock[c])});b+='<div class="m">只列標題、來源、時間與連結，不做摘要，不標利多利空；已過濾論壇與社群貼文。機器翻譯可能把專有名詞或金融用語翻錯，以英文原題為準。</div>'}h+=card('新聞標題',b)})();
document.getElementById('app').innerHTML=h;
</script></body></html>
