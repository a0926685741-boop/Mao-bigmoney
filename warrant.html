<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>權證</title>
<style>
:root{--bg:#0f1115;--c:#171a21;--l:#2a2f3a;--t:#e5e7eb;--m:#9ca3af;--up:#ef4444;--dn:#22c55e;--ac:#38bdf8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px Arial,"Microsoft JhengHei",sans-serif;padding-bottom:30px}
header{position:sticky;top:0;background:var(--bg);padding:10px 12px;border-bottom:1px solid var(--l);z-index:5;display:flex;justify-content:space-between;align-items:center}
h1{font-size:16px;margin:0}small,.m{color:var(--m);font-size:12px}a{color:var(--ac);text-decoration:none}
main{padding:10px 12px;max-width:1100px;margin:auto}
.box{background:var(--c);border:1px solid var(--l);border-radius:8px;padding:10px;margin-bottom:10px}
.tabs,.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
button,.b{background:var(--c);color:var(--t);border:1px solid var(--l);border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer}
button.on{background:var(--ac);color:#000;border-color:var(--ac)}
input{background:#0b0d11;color:var(--t);border:1px solid var(--l);border-radius:6px;padding:6px 8px;font-size:14px}
input.n{width:64px}input.q{width:180px}
.cr{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:6px;font-size:13px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th,td{padding:5px 7px;border-bottom:1px solid var(--l);text-align:right}th:first-child,td:first-child,th.l,td.l{text-align:left}
th{color:var(--m);font-weight:normal;position:sticky;top:0;background:var(--c)}tr.k{cursor:pointer}tr.k:hover{background:#1d222b}
.up{color:var(--up)}.dn{color:var(--dn)}.nt{font-size:12px;color:var(--m);line-height:1.6;margin-top:8px}
</style></head><body>
<header><h1>權證</h1><span><a href="index.html">‹ 監盤</a>　<a href="screener.html">選股</a>　<small id="upd"></small></span></header>
<main>
<div class="tabs"><button id="t1" class="on">查詢（挑權證）</button><button id="t2">排行榜</button></div>
<div id="p1">
 <div class="box">
  <input id="q" class="q" list="ul" placeholder="標的代號或名稱，例 2330" autocomplete="off"><datalist id="ul"></datalist>
  <span class="seg" style="display:inline-flex;margin:0 0 0 6px"><button id="kC" class="on">多（認購）</button><button id="kP">空（認售）</button></span>
  <div id="ui" class="m" style="margin-top:6px"></div>
  <div class="cr">
   <label>剩餘天數 ≥ <input id="cD" class="n" type="number" value="90"></label>
   <label>價內外% <input id="cM1" class="n" type="number" value="-15"> ~ <input id="cM2" class="n" type="number" value="5"></label>
   <label>差槓比 ≤ <input id="cG" class="n" type="number" step="0.05" value="0.3"></label>
   <label>有效槓桿 <input id="cL1" class="n" type="number" value="3"> ~ <input id="cL2" class="n" type="number" value="15"></label>
   <label>權證價 ≥ <input id="cP" class="n" type="number" step="0.05" value="0.3"></label>
   <label><input id="cO" type="checkbox"> 含上櫃（無買賣價，不算差槓比）</label>
   <label><input id="cA" type="checkbox"> 忽略條件，全部列出</label>
  </div>
 </div>
 <div class="box"><div class="tw" id="res"></div><div class="nt" id="nt1"></div></div>
</div>
<div id="p2" style="display:none">
 <div class="box">
  <div class="seg" id="sw"><button data-v="2" class="on">近 2 日</button><button data-v="15">近 15 日</button></div>
  <div class="seg" id="sk"><button data-v="A" class="on">認購+認售</button><button data-v="C">認購</button><button data-v="P">認售</button></div>
  <div class="seg" id="sm"><button data-v="T" class="on">上市</button><button data-v="O">上櫃</button></div>
  <div class="tw" id="rk"></div><div class="nt" id="nt2"></div>
 </div>
</div>
<div class="box nt">說明：權證價格取最後揭示買賣價中間值（無報價才用收盤）。隱含波動率(IV)、Delta 由 Black-Scholes 自行推算（無風險利率 1.5%、不計股利），僅供參考。有效槓桿＝|Delta|×股價×行使比例÷權證價。價差比＝(賣−買)÷權證價；差槓比＝價差比÷有效槓桿，越小越划算。價內外% 正為價內、負為價外。預設條件是市場常見的選擇慣例，不是官方標準，可自行調整。櫃買沒有買賣價與歷史資料；上櫃排行從系統開始累積那天起算。「剩餘發行」為發行商尚未賣出張數，無法取得流通在外比例。本頁只呈現事實，買賣由你判斷。</div>
</main>
<script>
var W=[],U={},H={tw:{},ot:{}},kind='C',rkW='2',rkK='A',rkM='T';
function $(i){return document.getElementById(i)}
function nf(x,d){return x==null?'-':Number(x).toFixed(d==null?2:d)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function cj(u){return fetch(u+'?t='+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json()}).catch(function(){return null})}
Promise.all([cj('warrants.json'),cj('warrant_hist.json')]).then(function(a){
 if(a[0]){W=a[0].w;U=a[0].u;$('upd').textContent='資料 '+(a[0].dt||'-')+(a[0].do&&a[0].do!==a[0].dt?'（櫃買 '+a[0].do+'）':'');
  var n=(a[0].note||[]).join('；');if(n)$('nt1').textContent='注意：'+n}
 else $('res').innerHTML='<span class="m">尚無資料，請先到 GitHub Actions 執行 update-warrant。</span>';
 if(a[1])H=a[1];
 var dl='';Object.keys(U).sort().forEach(function(c){dl+='<option value="'+c+'">'+esc(U[c][0])+'</option>'});$('ul').innerHTML=dl;
 var p=new URLSearchParams(location.search).get('s');if(p){$('q').value=p;}
 run();rank()});
function findU(){var v=$('q').value.trim();if(!v)return null;if(U[v])return v;var m=null;Object.keys(U).forEach(function(c){if(!m&&U[c][0]&&U[c][0].indexOf(v)>=0)m=c});return m}
function run(){
 var u=findU(),h='';
 if(!u){$('ui').textContent=$('q').value?'找不到此標的（只收有權證的個股）':'輸入標的後顯示結果';$('res').innerHTML='';return}
 var ui=U[u],med=ui[kind==='C'?2:3];
 $('ui').innerHTML=esc(ui[0])+' '+u+'　股價 '+nf(ui[1])+'　'+(kind==='C'?'認購':'認售')+'共 '+ui[kind==='C'?4:5]+' 檔　同標的 IV 中位數 '+(med==null?'-':med+'%');
 var all=$('cA').checked,D=+$('cD').value,m1=+$('cM1').value,m2=+$('cM2').value,G=+$('cG').value,L1=+$('cL1').value,L2=+$('cL2').value,P=+$('cP').value,O=$('cO').checked;
 var r=W.filter(function(w){
  if(w[5]!==u||w[3]!==kind)return false;
  if(all)return true;
  if(w[2]==='O'&&!O)return false;
  if(w[9]<D||w[21]<m1||w[21]>m2||w[19]<L1||w[19]>L2||w[10]<P)return false;
  if(w[2]==='T'&&(w[22]==null||w[22]>G))return false;
  return true});
 r.sort(function(a,b){var x=a[22]==null?99:a[22],y=b[22]==null?99:b[22];return x-y||b[16]-a[16]});
 h='<table><tr><th>權證</th><th>發行商</th><th>履約價</th><th>比例</th><th>剩餘天</th><th>價內外%</th><th>價格</th><th>買/賣</th><th>價差%</th><th>有效槓桿</th><th>IV%</th><th>IV−中位</th><th>差槓比</th><th>量(張)</th><th>剩餘發行(張)</th></tr>';
 r.forEach(function(w){var dv=(med!=null)?w[17]-med:null;
  h+='<tr><td>'+w[0]+' '+esc(w[1])+(w[2]==='O'?' <small>櫃</small>':'')+'</td><td>'+esc(w[4])+'</td><td>'+nf(w[7])+'</td><td>'+nf(w[8],3)+'</td><td>'+w[9]+'</td><td>'+nf(w[21],1)+'</td><td>'+nf(w[10])+'</td><td>'+(w[11]!=null?nf(w[11])+'/'+nf(w[12]):'-')+'</td><td>'+nf(w[20])+'</td><td>'+nf(w[19],1)+'</td><td>'+nf(w[17],1)+'</td><td class="'+(dv==null?'':dv>0?'up':'dn')+'">'+(dv==null?'-':(dv>0?'+':'')+dv.toFixed(1))+'</td><td>'+nf(w[22],2)+'</td><td>'+w[15]+'</td><td>'+(w[23]==null?'-':Math.round(w[23]))+'</td></tr>'});
 h+='</table>';
 if(!r.length)h='<span class="m">沒有符合條件的權證，可放寬條件或勾「忽略條件」。（資料只保留每標的差槓比最佳的 14 檔上市＋成交額前 6 檔上櫃）</span>';
 $('res').innerHTML=h}
function rank(){
 var src=rkM==='T'?H.tw:H.ot,ds=Object.keys(src).sort().slice(-(+rkW)),agg={};
 ds.forEach(function(d){var o=src[d];Object.keys(o).forEach(function(c){var a=o[c],g=agg[c]||(agg[c]={n:a[0],c:0,cn:0,p:0,pn:0});g.c+=a[1];g.cn+=a[2];g.p+=a[3];g.pn+=a[4]})});
 var rows=Object.keys(agg).map(function(c){var g=agg[c];g.k=c;g.v=rkK==='C'?g.c:rkK==='P'?g.p:g.c+g.p;g.t=rkK==='C'?g.cn:rkK==='P'?g.pn:g.cn+g.pn;return g}).filter(function(g){return g.v>0}).sort(function(a,b){return b.v-a.v}).slice(0,50);
 var h='<table><tr><th>#</th><th class="l">標的</th><th>成交金額(萬)</th><th>筆數</th><th>認購金額(萬)</th><th>認售金額(萬)</th><th>認購占比</th></tr>';
 rows.forEach(function(g,i){var tot=g.c+g.p;h+='<tr class="k" data-c="'+g.k+'"><td>'+(i+1)+'</td><td class="l">'+g.k+' '+esc(g.n)+'</td><td>'+Math.round(g.v/1e4).toLocaleString()+'</td><td>'+g.t.toLocaleString()+'</td><td>'+Math.round(g.c/1e4).toLocaleString()+'</td><td>'+Math.round(g.p/1e4).toLocaleString()+'</td><td>'+(tot?Math.round(g.c/tot*100)+'%':'-')+'</td></tr>'});
 $('rk').innerHTML=rows.length?h+'</table>':'<span class="m">尚無資料</span>';
 $('nt2').textContent='統計區間：'+(ds.length?ds[0]+' ~ '+ds[ds.length-1]:'-')+'，共 '+ds.length+' 個交易日'+(ds.length<+rkW?'（資料尚不足 '+rkW+' 日，持續累積中）':'')+'。只含 4 碼個股，不含指數、ETF。點一列可查該標的權證。';
}
function seg(id,fn){$(id).addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;[].forEach.call($(id).children,function(x){x.classList.remove('on')});b.classList.add('on');fn(b.dataset.v)})}
seg('sw',function(v){rkW=v;rank()});seg('sk',function(v){rkK=v;rank()});seg('sm',function(v){rkM=v;rank()});
$('rk').addEventListener('click',function(e){var t=e.target.closest('tr.k');if(!t)return;$('q').value=t.dataset.c;tab(1);run()});
function tab(n){$('p1').style.display=n===1?'':'none';$('p2').style.display=n===2?'':'none';$('t1').classList.toggle('on',n===1);$('t2').classList.toggle('on',n===2)}
$('t1').onclick=function(){tab(1)};$('t2').onclick=function(){tab(2)};
$('kC').onclick=function(){kind='C';$('kC').classList.add('on');$('kP').classList.remove('on');run()};
$('kP').onclick=function(){kind='P';$('kP').classList.add('on');$('kC').classList.remove('on');run()};
['q','cD','cM1','cM2','cG','cL1','cL2','cP','cO','cA'].forEach(function(i){$(i).addEventListener('input',run);$(i).addEventListener('change',run)});
</script></body></html>
